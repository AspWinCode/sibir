version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sibir
      POSTGRES_PASSWORD: sibir
      POSTGRES_DB: sibir
    ports:
      - "5432:5432"
    volumes:
      - sibir_pg_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  sibir_pg_data:
